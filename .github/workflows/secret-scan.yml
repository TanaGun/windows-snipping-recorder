name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan tracked history and files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          # GitHub supplies this short-lived CI token at runtime. Its value is
          # never stored in the repository or application configuration.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify sensitive paths are ignored
        shell: bash
        run: |
          for path in .env .env.local secrets/example.key captures/example.png recordings/example.mp4 app.db certificate.pfx; do
            if ! git check-ignore -q "$path"; then
              echo "Expected $path to be ignored"
              exit 1
            fi
          done
          echo "Sensitive paths are ignored."
